<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operador · Extinsul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/logo.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="operador" class="painel ativo">

  <div class="cabecalho cabOperador">
    <h1>👷  OPERADOR</h1>
    <p>Registra vistorias, manutenções e atualiza o sistema</p>
  </div>

  <div class="sistema">

    <aside class="menu menuOperador">
      <div class="logo">
        <span class="logoIcon">🔥</span><strong>EXTINTORES</strong>
        <span>Gestão e Manutenção</span>
      </div>
      <ul>
        <li data-pagina="inicio" data-titulo="Início">⌂  Início</li>
        <li data-pagina="vistorias" data-titulo="Vistorias">▣  Vistorias</li>
        <li data-pagina="manutencoes" data-titulo="Manutenções">⚒  Manutenções</li>
        <li data-pagina="os" data-titulo="Ordens de Serviço">♥  Ordens de Serviço</li>
        <li data-pagina="extintores" data-titulo="Extintores">♜  Extintores</li>
        <li data-pagina="clientes" data-titulo="Clientes">♟  Clientes</li>
        <li data-pagina="fotos" data-titulo="Fotos">📷  Fotos</li>
      </ul>
      <div class="menuFinal">
        <div class="usuario">
          <div class="avatar">●</div>
          <div><span class="nomeUsuario">—</span><br><small>Operador</small></div>
        </div>
        <div class="sair">⇥  Sair</div>
      </div>
    </aside>

    <main class="conteudo">
      <div class="barra">
        <span class="tituloPagina" id="tituloPagina"></span>
        <span class="dataHoje2 dataCurta"></span>
      </div>
      <div id="pagina"></div>
    </main>

  </div>
</div>

<script src="../js/common.js"></script>
<script src="app.js"></script>
</body>
</html>
