name = "extinsul"
main = "src/worker.js"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "node scripts/build-public.js"

[assets]
directory = "./public"
binding = "ASSETS"
# Só as rotas /api/* passam pelo Worker; o resto é servido como arquivo estático
run_worker_first = ["/api/*"]

# .sql é embutido no bundle como texto (usado pela migração do estoque)
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# Segredos (não coloque aqui): wrangler secret put TURSO_DATABASE_URL | TURSO_AUTH_TOKEN | SESSION_SECRET

# express.json/body-parser e driver nativo libsql não carregam no Workers; redirecionados para versões compatíveis
[alias]
"body-parser" = "./src/stub-body-parser.js"
"@libsql/client" = "./src/libsql-worker.js"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
